[package]
name = "inventario-desktop"
version = "0.1.0"
description = "Cliente de escritorio de Inventario"
authors = ["Inventario"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde_json = "1"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
uuid = { version = "1", features = ["v4"] }
