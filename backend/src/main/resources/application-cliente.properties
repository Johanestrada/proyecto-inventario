spring.datasource.url=jdbc:sqlite:${LOCALAPPDATA}/Inventario/data/inventario.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# Use update to create schema for local profile
# We create the SQLite schema manually at startup to avoid dialect issues
spring.jpa.hibernate.ddl-auto=none

# Use a SQLite-specific dialect implemented in the project

# Let Hibernate resolve dialect automatically from JDBC metadata; no custom dialect configured here
spring.jpa.show-sql=false
