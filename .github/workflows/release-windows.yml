name: Release Windows

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build and test backend
        working-directory: backend
        shell: pwsh
        run: .\mvnw.cmd package

      - name: Build Java app-image
        shell: pwsh
        run: |
          $destination = Join-Path $PWD "app-image"
          Remove-Item $destination -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $destination | Out-Null
          jpackage `
            --type app-image `
            --name Inventario `
            --input backend/target/jpackage `
            --main-jar inventario-0.0.1-SNAPSHOT-plain.jar `
            --main-class com.inventario.inventario.InventarioApplication `
            --app-version 0.1.0 `
            --java-options "-Dspring.profiles.active=cliente" `
            --java-options "-Dserver.port=8090" `
            --dest $destination
          $serverDestination = Join-Path $PWD "desktop/src-tauri/resources/server/Inventario"
          Remove-Item $serverDestination -Recurse -Force -ErrorAction SilentlyContinue
          Copy-Item (Join-Path $destination "Inventario") $serverDestination -Recurse -Force
          $databases = Get-ChildItem $serverDestination -Recurse -File -Include *.db,*.sqlite,*.sqlite3
          if ($databases) {
            throw "The distribution contains databases: $($databases.FullName -join ', ')"
          }

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Build Tauri installer
        working-directory: desktop
        run: npm run tauri -- build

      - name: Publish installer
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/src-tauri/target/release/bundle/nsis/Inventario_0.1.0_x64-setup.exe
          generate_release_notes: true
